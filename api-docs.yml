openapi: 3.0.1
info:
  title: BeSy API
  description: API des Bestellsystems
  version: 2.0.0
servers:
  - url: http://localhost:3000
    description: Generated server url
paths:
  /api/v2/users/me/preferences/{id}:
    put:
      tags:
        - user-controller
      description: Aktualisiert eine Präferenz des aktuell authentifizierten Benutzers.
      operationId: updateUserPreferences
      parameters:
        - name: id
          in: path
          description: ID der Benutzerpräferenz.
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesRequestDTO'
        required: true
      responses:
        '400':
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Benutzerpräferenz nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDTO'
        '200':
          description: Benutzerpräferenzen erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDTO'
    delete:
      tags:
        - user-controller
      description: Löscht eine Präferenz des aktuell authentifizierten Benutzers.
      operationId: deleteUserPreferences
      parameters:
        - name: id
          in: path
          description: ID der Benutzerpräferenz.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '400':
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Benutzerpräferenz nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Interner Serverfehler
        '204':
          description: Benutzerpräferenz erfolgreich gelöscht
  /api/v2/suppliers/{supplier-id}:
    get:
      tags:
        - supplier-controller
      description: Gibt einen Lieferanten anhand seiner ID zurück.
      operationId: getSupplierById
      parameters:
        - name: supplier-id
          in: path
          description: "Die eindeutige ID des Lieferanten, welcher abgerufen werden\
            \ soll."
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lieferant nicht gefunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Lieferant gefunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponseDTO'
    put:
      tags:
        - supplier-controller
      description: Aktualisiert einen bestehenden Lieferanten anhand seiner ID.
      operationId: updateSupplier
      parameters:
        - name: supplier-id
          in: path
          description: "Die eindeutige ID des Lieferanten, welcher aktualisiert werden\
            \ soll."
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lieferant nicht gefunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Lieferant gefunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierWithAddressResponseDTO'
        '500':
          description: Interner Serverfehler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierWithAddressResponseDTO'
  /api/v2/persons/{id}:
    get:
      tags:
        - person-controller
      description: Gibt eine Person anhand ihrer ID zurück.
      operationId: getPersonById
      parameters:
        - name: id
          in: path
          description: Die ID der abzurufenden Person.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Person nicht gefunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Person erfolgreich abgerufen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponseDTO'
        '500':
          description: Interner Serverfehler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponseDTO'
    put:
      tags:
        - person-controller
      description: Aktualisiert eine bestehende Person anhand ihrer ID.
      operationId: updatePerson
      parameters:
        - name: id
          in: path
          description: Die ID der zu aktualisierenden Person.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Verweis auf eine nicht existierende Entität.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Interner Serverfehler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponseDTO'
        '200':
          description: Person erfolgreich aktualisiert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponseDTO'
  /api/v2/orders/{order-id}/status:
    put:
      tags:
        - order-controller
      description: "Aktualisiert den Bestellstatus (`status`) mit der angegebenen\
        \ `order-id`. Wirft einen Fehler, wenn der neue Status `DELETED` ist – bitte\
        \ stattdessen den DELETE-Endpunkt verwenden."
      operationId: updateOrderState
      parameters:
        - name: order-id
          in: path
          description: 'ID der Bestellung, deren Bestellstatus aktualisiert wird.'
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatus'
        required: true
      responses:
        '400':
          description: "Löschen nicht erlaubt, nutze DELETE endpoint! Ungültiger Statusü\
            bergang von `old_status` zu `new_status`. primary_cost_center_id darf\
            \ nicht null sein."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Bestellstatus erfolgreich aktualisiert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatus'
  /api/v2/users/me/preferences:
    get:
      tags:
        - user-controller
      description: Gibt die Präferenzen des aktuell authentifizierten Benutzers zurück.
      operationId: getUserPreferences
      parameters:
        - name: type
          in: query
          description: Filtert Benutzerpräferenzen nach Typ
          required: false
          schema:
            type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Benutzer nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Erfolgreiche Abfrage der Benutzerpräferenzen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPreferencesResponseDTO'
        '500':
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPreferencesResponseDTO'
    post:
      tags:
        - user-controller
      description: Fügt eine Präferenz für den aktuell authentifizierten Benutzer
        hinzu.
      operationId: addUserPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesRequestDTO'
        required: true
      responses:
        '400':
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Benutzerpräferenzen erfolgreich hinzugefügt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDTO'
        '500':
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDTO'
  /api/v2/suppliers:
    get:
      tags:
        - supplier-controller
      description: Gibt eine Liste von Lieferanten zurück.
      operationId: getAllSuppliers
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Liste von Lieferanten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplierResponseDTO'
    post:
      tags:
        - supplier-controller
      description: Erstellt einen neuen Lieferanten.
      operationId: createSupplier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequestDTO'
        required: true
      responses:
        '400':
          description: Ungültige Eingabe(n).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Interner Serverfehler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierWithAddressResponseDTO'
        '201':
          description: Lieferant erfolgreich erstellt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierWithAddressResponseDTO'
  /api/v2/suppliers/{supplier-id}/customer_ids:
    get:
      tags:
        - supplier-controller
      description: Gibt die Kundennummern eines Lieferanten zurück.
      operationId: getAllCustomerIds
      parameters:
        - name: supplier-id
          in: path
          description: "Die eindeutige ID des Lieferanten, für welchen die Kundennummern\
            \ abgerufen werden sollen."
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lieferant nicht gefunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Liste der Kundennummern eines Lieferanten.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerIdResponseDTO'
    post:
      tags:
        - supplier-controller
      description: Erstellt eine Kundennummer für einen Lieferanten.
      operationId: createCustomerId
      parameters:
        - name: supplier-id
          in: path
          description: "Die eindeutige ID des Lieferanten, für welchen die Kundennummer\
            \ erstellt werden soll."
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerIdRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |-
            Lieferantennummer bereits vorhanden für diesen Lieferanten.
            Verweis auf eine nicht existierende Entität.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lieferant nicht gefunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Kundennummer erfolgreich erstellt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerIdResponseDTO'
        '500':
          description: Interner Serverfehler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerIdResponseDTO'
  /api/v2/persons:
    get:
      tags:
        - person-controller
      description: Gibt alle Personen zurück.
      operationId: getAllPersons
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Liste aller Personen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonResponseDTO'
    post:
      tags:
        - person-controller
      description: Erstellt eine neue Person.
      operationId: createPerson
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Person erfolgreich erstellt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponseDTO'
        '500':
          description: Interner Serverfehler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponseDTO'
  /api/v2/persons/addresses:
    get:
      tags:
        - person-controller
      description: "Gibt eine Liste aller Adressen zurück, die Personen zugeordnet\
        \ sind."
      operationId: getAddresses
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Erfolgreich - Liste der Personenadressen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponseDTO'
      deprecated: true
    post:
      tags:
        - person-controller
      description: Erstellt eine Adresse für eine Person.
      operationId: createAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequestDTO'
        required: true
      responses:
        '400':
          description: Ungültige Eingabe(n).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Adresse erfolgreich erstellt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponseDTO'
        '500':
          description: Interner Serverfehler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponseDTO'
  /api/v2/orders:
    get:
      tags:
        - order-controller
      description: "Gibt Bestellungen paginiert zurück und ermöglicht die Filterung\
        \ nach Kostenstellen, Personen, Status, Preisen, Lieferanten, Zeitpunkten\
        \ und Suchbegriffen."
      operationId: getAllOrders
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          description: |-
            Sortierung der Ergebnisse. Standardmäßig nach Erstellungsdatum absteigend sortiert.
            Unterstützt mehrfache Sortierungen. Erster Parameter ist die Hauptsortierung, der letzte die niedrigste Sortierung. Anders ausgedrückt: Die Sortierungen werden von rechts nach links angewendet.
          schema:
            type: array
            items:
              type: string
              example: 'bookingYear,desc'
        - name: primaryCostCenters
          in: query
          description: Filtert nach IDs der primären Kostenstellen.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: bookingYears
          in: query
          description: "Filtert nach den letzten zwei Ziffern der Jahreszahl der Buchung.\
            \ Diese muss ein String sein, z. B. \"25\"."
          required: false
          schema:
            type: array
            items:
              type: string
        - name: createdAfter
          in: query
          description: "Filtert nach Bestellungen, welche nach oder zu diesem Zeitpunkt\
            \ erstellt wurden."
          required: false
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          description: "Filtert nach Bestellungen, welche vor oder zu diesem Zeitpunkt\
            \ erstellt wurden."
          required: false
          schema:
            type: string
            format: date-time
        - name: ownerIds
          in: query
          description: Filtert nach IDs der Ersteller der Bestellung.
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int32
        - name: statuses
          in: query
          description: Filtert nach dem Bestellstatus. Beinhaltet defaultmäßig alle
            Bestellstatus.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
        - name: quotePriceMin
          in: query
          description: Filtert nach quotePriceMin.
          required: false
          schema:
            type: number
        - name: quotePriceMax
          in: query
          description: Filtert nach quotePriceMax.
          required: false
          schema:
            type: number
        - name: deliveryPersonIds
          in: query
          description: Filtert nach IDs der Besteller.
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: invoicePersonIds
          in: query
          description: Filtert nach IDs der Rechnungsempfänger.
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: queriesPersonIds
          in: query
          description: Filtert nach IDs der anfragenden Personen.
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: customerIds
          in: query
          description: Filtert nach Kundennummern.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: supplierIds
          in: query
          description: Filtert nach IDs der Lieferanten.
          required: false
          schema:
            type: array
