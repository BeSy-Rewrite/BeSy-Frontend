components:
  schemas:
    ErrorResponse:
      required:
        - error
        - message
        - path
        - status
        - timestamp
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
      description: Standardisierte Fehlerantwort
    UserPreferencesRequestDTO:
      required:
        - preference_type
        - preferences
      type: object
      properties:
        preference_type:
          type: string
        preferences:
          type: object
    UserPreferencesResponseDTO:
      required:
        - id
        - preference_type
        - preferences
      type: object
      properties:
        id:
          type: integer
          format: int32
        preference_type:
          type: string
        preferences:
          type: object
          additionalProperties:
            type: object
    AddressRequestDTO:
      required:
        - town
      type: object
      properties:
        building_name:
          type: string
        street:
          type: string
        building_number:
          type: string
        town:
          type: string
        postal_code:
          maxLength: 20
          minLength: 0
          type: string
        county:
          type: string
        country:
          type: string
        comment:
          type: string
    SupplierRequestDTO:
      required:
        - address
        - flag_preferred
        - name
      type: object
      properties:
        name:
          type: string
        phone:
          maxLength: 45
          minLength: 0
          type: string
        fax:
          maxLength: 45
          minLength: 0
          type: string
        email:
          maxLength: 45
          minLength: 0
          type: string
        comment:
          type: string
        website:
          type: string
        vat_id:
          maxLength: 20
          minLength: 0
          type: string
        flag_preferred:
          type: boolean
        address:
          $ref: '#/components/schemas/AddressRequestDTO'
    AddressResponseDTO:
      required:
        - id
      type: object
      properties:
        id:
          type: integer
          format: int32
        building_name:
          type: string
        street:
          type: string
        building_number:
          type: string
        town:
          type: string
        postal_code:
          maxLength: 20
          minLength: 0
          type: string
        county:
          type: string
        country:
          type: string
        comment:
          type: string
    SupplierResponseDTO:
      required:
        - id
      type: object
      properties:
        id:
          type: integer
          format: int32
